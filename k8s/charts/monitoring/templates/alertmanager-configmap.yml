apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
    route:
      receiver: 'telegram'
      group_by: ['alertname']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 3h
    receivers:
      - name: 'telegram'
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/bot-token
            chat_id: 1926419695
            parse_mode: 'HTML'
            message: '{{ range .Alerts }}<b>{{ .Labels.alertname }}</b>: {{ .Annotations.summary }}
              {{ end }}'