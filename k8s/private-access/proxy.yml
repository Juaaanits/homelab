apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring-private-proxy
  namespace: monitoring
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events { worker_connections 128; }
    http {
      access_log /dev/stdout;
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;
      resolver 10.43.0.10 valid=10s ipv6=off;
      server {
        listen 127.0.0.1:19090;
        location / {
          set $backend prometheus.monitoring.svc.cluster.local:9090;
          proxy_pass http://$backend;
          proxy_http_version 1.1;
          proxy_set_header Host $http_host;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
          proxy_read_timeout 300s;
        }
      }
      server {
        listen 127.0.0.1:13000;
        location / {
          set $backend grafana.monitoring.svc.cluster.local:3000;
          proxy_pass http://$backend;
          proxy_http_version 1.1;
          proxy_set_header Host $http_host;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
          proxy_read_timeout 300s;
        }
      }
      server {
        listen 127.0.0.1:19093;
        location / {
          set $backend alertmanager.monitoring.svc.cluster.local:9093;
          proxy_pass http://$backend;
          proxy_http_version 1.1;
          proxy_set_header Host $http_host;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
          proxy_read_timeout 300s;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring-private-proxy
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: monitoring-private-proxy
  template:
    metadata:
      labels:
        app: monitoring-private-proxy
    spec:
      nodeSelector:
        kubernetes.io/hostname: ubuntu
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          command: [nginx]
          args: [-g, 'daemon off;']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            exec:
              command: [wget, -q, -O, /dev/null, 'http://127.0.0.1:19090/-/ready']
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: monitoring-private-proxy
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
