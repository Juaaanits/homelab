apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus-ingress
  namespace: monitoring
spec:
  ingressClassName: traefik
  rules:
  - host: prometheus.192-168-1-17.sslip.io
    http:
      paths: 
        - path: /
          pathType: Prefix
          backend:
            service:
              name: prometheus
              port:
                number: 9090