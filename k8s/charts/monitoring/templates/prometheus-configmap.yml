apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    rule_files:
      - /etc/prometheus/alert_rules.yml
    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
      - job_name: "node"
        static_configs:
          - targets: ['node-exporter:9100']
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager:9093']